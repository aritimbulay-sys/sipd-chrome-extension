<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Laporan SIPD — Perangkat Daerah, Batasan Pagu SKPD, Rincian Belanja</title>
  <style>
    :root { --blue: #1d4ed8; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; color: var(--ink); background: #fff; }
    h1 { margin: 0 0 4px; font-size: 18px; color: var(--blue); }
    .summary { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
    .sub { margin: 0 0 14px; font-size: 11px; color: var(--muted); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
    .live { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .auto-wrap { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; }
    .auto-wrap input[type="number"] { width: 58px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; font-size: 12px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th, td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; }
    th { background: #f1f5f9; font-weight: 700; color: #000; text-align: center; }
    td { color: #000; font-weight: 700; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.ctr { text-align: center; }
    tr.total { background: #e8efff; font-weight: 700; }
    td.ok { color: #065f46; font-weight: 800; }
    td.kurang { color: #92400e; font-weight: 800; }
    td.lebih { color: #991b1b; font-weight: 800; }
    tr.sesuai td { background: #92d050; }
    tr.lebih-row td { background: #ff5050; }
    .stagnan { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; vertical-align: middle; }
    .badge-hijau { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #16a34a; color: #fff; font-size: 10.5px; font-weight: 700; }
    .badge-merah { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #dc2626; color: #fff; font-size: 10.5px; font-weight: 700; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .foot { margin-top: 10px; font-size: 10.5px; color: var(--muted); }
    @media print {
      .toolbar { display: none; }
      body { padding: 12px; }
      @page { size: A4 landscape; margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-print" class="primary">Cetak / Simpan PDF</button>
    <button id="btn-png">Simpan PNG</button>
    <button id="btn-reload">Muat Ulang Data SIPD</button>
    <label class="auto-wrap"><input type="checkbox" id="auto-on"> Muat ulang otomatis tiap <input type="number" id="auto-min" min="1" max="1440" value="5"> menit</label>
    <span class="live" id="live">Memuat…</span>
  </div>
  <p class="sub" id="sub">Memuat data…</p>
  <h1 id="title">Laporan Progres Input Rincian Belanja pada Aplikasi SIPD Tahun Anggaran 2027</h1>
  <p class="summary" id="summary"></p>
  <div id="wrap"></div>
  <p class="foot" id="foot"></p>

  <script src="lib/util.js"></script>
  <script src="lib/extract.js"></script>
  <script src="lib/db.js"></script>
  <script src="report.js"></script>
</body>
</html>
